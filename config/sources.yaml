    reason: "law360.com - 購読契約必須(法人$2,000+/年)"
  - id: bloomberg
    reason: "Bloomberg Terminal - API契約必須"
  - id: reuters_eikon
    reason: "Refinitiv Eikon - 法人契約必須"
