# US専門ニュース・制度変更トラッカー
# 各sourceの mode:
#   rss  - 公式RSSをそのまま集約（自前パース不要）
#   govdelivery - GovDeliveryのtopic feed (govdelivery公式)
#   api  - 公式JSON/HTML APIを定期取得→Atom生成
#   scrape - HTMLをスクレイプ→Atom生成
#   unavailable - 有償のみでRSS化不可
#
# 各siteの adapter は adapters/<name>.py に書く。

version: 2
updated: "2026-10-15"

defaults:
  user_agent: "Mozilla/5.0 (US-News-RSS-Aggregator; admin@example.com)"
  fetch_interval_minutes: 30
  request_timeout_sec: 20
  max_items_per_feed: 30

sources:

  # ========== Tier 1: 政府・規制 ==========
  - id: federal_register
    title: "Federal Register - All Documents"
    category: government
    mode: api
    endpoint: "https://www.federalregister.gov/api/v1/documents.json"
    params:
      per_page: 30
      order: "newest"
    priority: critical
    business_signal: high
    notes: "規制改正の最重要一次ソース。publication_dateでフィルタ可能。"

  - id: federal_register_rss
    title: "Federal Register - Daily RSS"
    category: government
    mode: rss
    endpoint: "https://www.federalregister.gov/documents/current.rss"
    priority: critical

  - id: white_house
    title: "White House News"
    category: government
    mode: rss
    endpoint: "https://www.whitehouse.gov/news/feed"
    priority: high
    notes: "official news RSS"

  - id: sec_press
    title: "SEC Press Releases"
    category: government
    mode: rss
    endpoint: "http://www.sec.gov/rss/news/press.xml"
    priority: critical
    notes: "User-Agent明示必須。10req/sec制限。"

  - id: sec_edgar_full
    title: "SEC EDGAR - Form 8-K (full-text via API)"
    category: government
    mode: api
    endpoint: "https://efts.sec.gov/LATEST/search-index"
    params:
      forms: "8-K"
      per_page: 30
    priority: critical
    notes: "企業の重要イベント（決算・M&A・リストラ）を早期検知。"

  - id: ftc
    title: "FTC Press Releases"
    category: government
    mode: rss
    endpoint: "https://www.ftc.gov/feeds/press-release.xml"
    priority: high

  - id: federal_reserve
    title: "Federal Reserve Press Releases"
    category: financial
    mode: rss
    endpoint: "http://www.federalreserve.gov/feeds/press_all.xml"
    priority: critical

  - id: cftc
    title: "CFTC - General Press Releases"
    category: financial
    mode: rss
    endpoint: "https://www.cftc.gov/RSS/RSSGP/rssgp.xml"
    priority: high

  - id: cftc_enforcement
    title: "CFTC - Enforcement Press Releases"
    category: financial
    mode: rss
    endpoint: "https://www.cftc.gov/RSS/RSSENF/rssenf.xml"
    priority: high

  # ========== 金融・銀行・暗号資産 ==========
