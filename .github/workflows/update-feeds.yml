name: Update Feeds

on:
  schedule:
    - cron: '*/30 * * * *'   # 30分ごと
  workflow_dispatch:           # 手動実行も可能

permissions:
  contents: write   # feeds/ への commit 用

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run aggregator
        run: python aggregator.py --fetch-all

      - name: Build index page
        run: python make_index.py

      - name: Commit & push updated feeds
        run: |
          git config user.name "feed-bot"
          git config user.email "bot@users.noreply.github.com"
          git add feeds/ index.html
          # 変更がなければコミットしない
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Auto-update feeds $(date -u +%FT%TZ)"
            git push
          fi